<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vuelve a Despega</title>
<meta name="robots" content="noindex">
<!-- Retorno del OAuth de Plaid en iPhone. Normalmente iOS abre la app
     directamente por el dominio asociado y nadie ve esta página; solo aparece
     si el enlace universal falla (app no instalada, ajuste del sistema). -->
<style>
  :root { --ink:#1a1a1a; --muted:#595959; --accent:#ff6b54; --bg:#fff; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; display:grid; min-height:100vh; place-items:center; padding:24px; box-sizing:border-box; }
  main { max-width:420px; text-align:center; }
  .logo { width:64px; height:64px; margin:0 auto 18px; border-radius:16px; background:linear-gradient(135deg,#ff9a5c,#ff6b54); display:grid; place-items:center; color:#fff; font-weight:800; font-size:28px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 18px; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; font-weight:700; border-radius:999px; padding:12px 24px; }
  .en { margin-top:28px; font-size:14px; }
</style>
</head>
<body>
<main>
  <div class="logo">D</div>
  <h1>Tu banco ya te ha devuelto a Despega</h1>
  <p>Vuelve a la app de Despega para terminar de conectar el banco. Si no se abre sola, toca el botón.</p>
  <a class="btn" href="despega://plaid-oauth">Abrir Despega</a>
  <p class="en">Your bank has sent you back to Despega. Return to the Despega app to finish connecting; if it does not open on its own, tap the button.</p>
</main>
</body>
</html>
