# Sitio estatico de despegacredito.com en Render.
#
# Existe porque GitHub Pages se quedo atascado emitiendo el certificado HTTPS
# (mas de 18 horas con el DNS correcto), y Plaid exige la politica de
# privacidad por https. Render emite el certificado solo, en minutos.
#
# En Render: New > Blueprint > este repositorio. Despues, en Porkbun, apuntar
# el dominio a lo que Render indique (un CNAME para www y un A para la raiz).

services:
  - type: web
    name: despega-site
    runtime: static
    staticPublishPath: .
    domains:
      - despegacredito.com
      - www.despegacredito.com
    routes:
      # Las URL publicas no llevan .html: /privacy y /terms son las que estan
      # en la politica, en la app y en la solicitud de Plaid.
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      # Pagina de borrado de cuenta que exige Google Play (Data safety).
      - type: rewrite
        source: /delete-account
        destination: /delete-account.html
    # Cabeceras de seguridad. Sin ellas un usuario desconfiado (o un escaner)
    # ve un sitio de credito sin HSTS ni CSP. La CSP admite script y estilo en
    # linea porque las paginas los llevan asi (sitio estatico, sin nonce);
    # todo lo demas queda cerrado: sin marcos, sin objetos, sin conexiones
    # fuera del propio dominio.
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
